[project]
name = "medibot"
version = "0.1.0"
description = "Role-aware hybrid RAG assistant for MediAssist Health Network"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling>=2.126.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "groq>=1.7.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pyjwt>=2.13.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medibot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs the built Qdrant index and downloaded models",
]
filterwarnings = [
    # third-party noise: starlette's test client and anyio, nothing in medibot
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["medibot"]
omit = ["medibot/ingest.py"]
